[build-system]
requires = ["scikit-build-core>=1.0", "pybind11>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "pvzemu"
version = "0.9.0"
description = "Plants vs. Zombies Survival Endless emulator."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "testla" }]

[project.urls]
Homepage = "https://github.com/dnartz/PvZ-Emulator"

[tool.scikit-build]
minimum-version = "1.0"
build-dir = "build/{wheel_tag}"
cmake.args = ["-DPVZEMU_BUILD_PYBIND=ON"]
wheel.packages = []
